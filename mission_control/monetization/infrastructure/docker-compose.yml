# OpenClaw Revenue Generation Infrastructure
# Docker Compose configuration for microservices deployment
# Version 1.0 | July 25, 2026

version: '3.8'

services:
  # API Gateway
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-server
      - websocket-server
    restart: unless-stopped
    networks:
      - openclaw-network

  # Main API Server
  api-server:
    build:
      context: ./scripts
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=openclaw
      - DB_USER=openclaw
      - DB_PASS=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
    volumes:
      - api-data:/app/data
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - openclaw-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # WebSocket Server for Real-time Data
  websocket-server:
    build:
      context: ./scripts
      dockerfile: Dockerfile.ws
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_HOST=redis
    depends_on:
      - redis
      - api-server
    restart: unless-stopped
    networks:
      - openclaw-network

  # Research Worker
  research-worker:
    build:
      context: ./scripts
      dockerfile: Dockerfile.worker
    environment:
      - NODE_ENV=production
      - WORKER_TYPE=research
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - research-data:/app/data
      - ./reports:/app/reports
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - openclaw-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # Trading Signal Worker
  signal-worker:
    build:
      context: ./scripts
      dockerfile: Dockerfile.worker
    environment:
      - NODE_ENV=production
      - WORKER_TYPE=signals
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - openclaw-network

  # Billing Worker
  billing-worker:
    build:
      context: ./scripts
      dockerfile: Dockerfile.worker
    environment:
      - NODE_ENV=production
      - WORKER_TYPE=billing
      - DB_HOST=postgres
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - openclaw-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=openclaw
      - POSTGRES_USER=openclaw
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - openclaw-network
    deploy:
      resources:
        limits:
          memory: 1G

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - openclaw-network
    deploy:
      resources:
        limits:
          memory: 256M

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - openclaw-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - openclaw-network

  # Elasticsearch for Logs
  elasticsearch:
    image: elasticsearch:8.10.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    networks:
      - openclaw-network

  # Logstash for Log Processing
  logstash:
    image: logstash:8.10.0
    volumes:
      - ./monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - openclaw-network

  # Kibana for Log Visualization
  kibana:
    image: kibana:8.10.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - openclaw-network

volumes:
  postgres-data:
  redis-data:
  api-data:
  research-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:

networks:
  openclaw-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
